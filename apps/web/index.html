      <section>
        <h1>Adrift 漂流足跡｜地圖日記與城市記憶平台</h1>
        <p>把生活，留在發生的地方。在地圖上留下生活片段，重新遇見你與別人的城市記憶。</p>
        <p>記錄地點、心情與故事，讓生活軌跡不只是打卡，而是可以被回顧的記憶地圖。</p>
        <p>Adrift 結合地圖日記、情緒足跡、好友記憶與 Adrift Intelligence，讓每個地點都能成為可回顧的生活節點。</p>
        <p>Adrift 漂流足跡是一個以地圖為核心的生活記錄與城市記憶平台。使用者可以在去過的地點留下日記、照片與情緒，並與好友建立共同的城市記憶。</p>
        <p>Adrift 的核心是地點 × 記憶 × 情緒 × 人際關係。幾個月、幾年後，這張地圖會慢慢變成你的生活。</p>
        <p>Google Maps 記得路線，Instagram 記得照片，一般日記 App 記得文字；Adrift 記得你在某個地方的心情與故事。</p>
        <p>Adrift 不需要一開始就有很多朋友或公開內容。你可以先把它當成自己的記憶地圖，讓每一篇日記慢慢累積成生活軌跡。</p>
        <p>每篇日記都可以選擇私人、好友可見或公開可見，讓使用者控制誰能看見自己的城市記憶。</p>
