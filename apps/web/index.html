<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fcff" />
    <meta name="description" content="Adrift 漂流足跡，一個結合地圖、日記、情緒、社交與 Adrift Intelligence 的互動式生活記錄平台。" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest?v=3" />
    <title>Adrift: Echoes of Places</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('adrift-theme');
          document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'bright';
        } catch (error) {
          document.documentElement.dataset.theme = 'bright';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
