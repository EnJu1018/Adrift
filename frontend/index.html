<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adrift: Echoes of Places</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('adrift-theme');
          document.documentElement.dataset.theme = savedTheme === 'bright' || savedTheme === 'lightened' ? 'bright' : 'dark';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
