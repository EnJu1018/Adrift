<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="Adrift 漂流足跡，一個結合地圖、日記、情緒、社交與 Adrift Intelligence 的互動式生活記錄平台。" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Adrift: Echoes of Places</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('adrift-theme');
          document.documentElement.dataset.theme = savedTheme === 'bright' || savedTheme === 'lightened' ? 'bright' : 'dark';
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
